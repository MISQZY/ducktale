name: CI / Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]

# Only one run per ref at a time — a new push (or re-run) cancels whatever
# was already in flight for that same branch/tag instead of queuing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs that need more (packages: write to push the
# image) opt in explicitly instead of the whole workflow running read-write.
permissions:
  contents: read

env:
  NODE_VERSION: 22
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner/repo automatically (GHCR requires a lowercase
      # path) and derives both a `latest` tag and one pinned to this commit's
      # short SHA, so a specific build can always be identified/rolled back
      # to even after `latest` has moved on.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # DATABASE_URL here only satisfies Prisma's build-time schema
      # validation (`prisma generate`, run from postinstall) — it's never
      # used to actually connect during the build, so a placeholder is
      # fine and no real credentials need to be exposed to CI for it.
      # SITE_DB_TABLE_PREFIX is real: it's baked into the generated site-db
      # client's @@map() table names and must match production.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=mysql://build:build@localhost:3306/build
            SITE_DB_TABLE_PREFIX=${{ vars.SITE_DB_TABLE_PREFIX }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash deploy.sh"
