services:
  app:
    # Built and pushed by CI (.github/workflows/deploy.yml), not built here —
    # deploy.sh just pulls this tag. Requires the ghcr.io/misqzy/ducktale
    # package to be public (or the host to `docker login ghcr.io` first).
    image: ghcr.io/misqzy/ducktale:latest
    container_name: ducktale_app
    restart: unless-stopped
    # Loads every var from the server's .env into the container at runtime
    # (DATABASE_URL, DATABASE_URL_SITE, AUTH_SECRET, NEXT_PUBLIC_SITE_URL,
    # etc. — see .env.example for the full list). The image itself carries
    # none of these: it's built in CI, which never has this file, so there's
    # nothing here to bake in even by accident.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - ducktale-network

networks:
  ducktale-network:
    external: true
