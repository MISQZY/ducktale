services:
  app:
    build:
      context: .
      args:
        # Передаётся из .env на хосте при сборке (для prisma generate)
        DATABASE_URL: ${DATABASE_URL}
    container_name: ducktale_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Prisma использует эту переменную в рантайме для подключения к БД
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - ducktale-network

networks:
  ducktale-network:
    external: true
