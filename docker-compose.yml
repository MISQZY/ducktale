services:
  app:
    build:
      context: .
      args:
        # Передаётся из .env на хосте при сборке (для prisma generate)
        DATABASE_URL: ${DATABASE_URL}
        # Baked into the generated site-db Prisma client's @@map() table
        # names at build time — must match the prefix the tables were
        # actually created with (see .env.example).
        SITE_DB_TABLE_PREFIX: ${SITE_DB_TABLE_PREFIX}
    container_name: ducktale_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Prisma использует эту переменную в рантайме для подключения к БД
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - ducktale-network

networks:
  ducktale-network:
    external: true
