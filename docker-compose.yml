services:
  app:
    # Built and pushed by CI (.github/workflows/deploy.yml), not built here —
    # deploy.sh just pulls this tag. Requires the ghcr.io/misqzy/ducktale
    # package to be public (or the host to `docker login ghcr.io` first).
    image: ghcr.io/misqzy/ducktale:latest
    container_name: ducktale_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Prisma использует эту переменную в рантайме для подключения к БД
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - ducktale-network

networks:
  ducktale-network:
    external: true
