services:
  app:
    build:
      context: .
      args:
        # Передаётся из .env на хосте при сборке (для prisma generate)
        DATABASE_URL: ${DATABASE_URL}
    container_name: ducktale_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Prisma использует эту переменную в рантайме для подключения к БД
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: ducktale_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
